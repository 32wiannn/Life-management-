<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--mute:#8a8a8e;--blue:#007aff;--onb:#fff;--ebg:rgba(120,120,128,.12);--sep:rgba(60,60,67,.14);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#fff;--mute:#98989d;--blue:#0a84ff;--onb:#fff;--ebg:rgba(120,120,128,.24);--sep:rgba(84,84,88,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#fff;--mute:#98989d;--blue:#0a84ff;--onb:#fff;--ebg:rgba(120,120,128,.24);--sep:rgba(84,84,88,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding:24px 16px 40px;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue)}
[contenteditable]{outline:none;border-radius:6px}
[contenteditable]:focus{background:var(--ebg)}
.nav{display:flex;align-items:center;gap:8px}
.nav h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;text-align:center;flex:1}
.arrow{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--blue);font-size:22px;line-height:1}
#sub{color:var(--mute);font-size:15px;margin:4px 0;text-align:center;min-height:22px}
#sub:empty::before{content:attr(data-ph)}
.hint,.note{color:var(--mute);font-size:13px;margin:0 0 16px;text-align:center}
.note{font-size:12px;margin:12px 0 0}
.card{background:var(--card);border:1px solid rgba(128,128,120,.12);border-radius:20px;padding:14px 10px;margin-bottom:12px}
.big{text-align:center;padding:6px 0 12px}
.big b{display:block;font-size:34px;font-weight:700;letter-spacing:-.02em}
.big span{font-size:13px;color:var(--mute)}
.tcs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
.tcs div{text-align:center;min-width:56px}
.tcs b{font-size:20px;font-weight:600;display:block}
.tcs span{font-size:12px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0 6px}
.c{position:relative;border:0;border-radius:12px;min-height:74px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--ebg)}
.c.s{background:color-mix(in srgb,var(--tc) 14%,transparent)}
.c.s .t{color:var(--tc)}
.c.today .d{background:var(--blue);color:var(--onb)}
.d{font-size:16px;font-weight:600;line-height:1;padding:3px 7px;border-radius:50%}
.t{font-size:10.5px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.h{font-size:10px;color:var(--mute)}
.nd{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--mute)}
.yr{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.yr b{min-width:48px;text-align:center}
.yr button{background:none;border:0;color:var(--blue);font-size:20px;padding:0 8px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chips button{border:0;background:var(--ebg);border-radius:10px;padding:9px 0;font-size:14px}
.chips button.on{background:var(--blue);color:var(--onb);font-weight:600}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px}
.row button,.link{background:none;border:0;color:var(--blue);font-size:16px}
dialog{border:0;border-radius:22px;background:var(--card);color:var(--text);padding:18px;width:min(92vw,440px);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{font-size:18px;margin:0 0 12px}
dialog h3{font-size:13px;color:var(--mute);font-weight:600;margin:18px 0 8px}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid transparent;background:var(--ebg);border-radius:999px;padding:8px 14px;font-size:14px}
.chip.on{border-color:var(--blue)}
dialog label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;border:0;background:var(--ebg);border-radius:10px;padding:10px;font-size:16px}
dialog input[type=color]{padding:0;width:40px;height:38px;flex:none;background:none}
.btn{width:100%;border:0;border-radius:12px;background:var(--ebg);padding:11px;margin-top:8px;font-size:15px;color:var(--blue)}
.btn.p{background:var(--blue);color:var(--onb);font-weight:600}
.fr,.tr{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.fr input,.fr select{min-width:0}
.fr span{font-size:13px;color:var(--mute)}
.tr .x{border:0;background:none;color:#ff453a;font-size:16px;padding:6px}
.tr input:nth-of-type(3){width:64px;flex:none}
#pb h2{font-size:18px;margin:0 0 4px}
.pr{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:15px}
.pr span:first-child{color:var(--mute)}
.pr.b{font-weight:600;border-top:1px solid var(--ebg)}
.pr.t{font-weight:700;font-size:19px;border-top:1px solid var(--ebg);margin-top:4px;padding-top:11px}
.pr.t span:first-child{color:var(--text)}
.est{text-align:center;font-size:15px;font-weight:600;margin-top:12px;color:var(--blue)}
.pr .x{border:0;background:none;color:#ff453a;font-size:15px;padding:0 0 0 12px}
@media print{body{background:#fff;color:#000;padding:0}.arrow,.hint,.row,.note,.yrc{display:none}.card{break-inside:avoid;border:1px solid #ddd}.c,.c.s{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

:root{--dbg:#f2f2f7;--dcard:#fff;--dtx:#000;--dmu:#8a8a8e;--dln:rgba(60,60,67,.14);--dac:#007aff;--dac2:#007aff;--drd:#ff3b30}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--dbg:#000;--dcard:#1c1c1e;--dtx:#fff;--dmu:#98989d;--dln:rgba(84,84,88,.5);--dac:#0a84ff;--dac2:#0a84ff;--drd:#ff453a}}
:root[data-theme="dark"]{--dbg:#000;--dcard:#1c1c1e;--dtx:#fff;--dmu:#98989d;--dln:rgba(84,84,88,.5);--dac:#0a84ff;--dac2:#0a84ff;--drd:#ff453a}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#pay,#exb{display:none}
#dash{max-width:560px;margin:0 auto;font-size:15px;line-height:1.45}
.dti{font-size:26px;font-weight:700;margin:4px 2px 14px}
.dhero{background:var(--dac);color:var(--onb);border-radius:24px;padding:22px}
.dhero small{opacity:.9;display:block}
.dhero b{display:block;font-size:34px;font-weight:700;margin:4px 0 12px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dc{background:var(--dcard);color:var(--dtx);border:1px solid var(--dln);border-radius:18px;padding:14px;margin-top:12px}
.dg .dc{margin-top:0}
.dc small{color:var(--dmu);display:block;font-size:13px}
.dc b{font-size:19px}
#dash input,#dash select{width:100%;box-sizing:border-box;font:inherit;color:var(--dtx);padding:11px 12px;border-radius:12px;border:1px solid var(--dln);background:var(--dbg);margin-top:8px}
.dbtn{width:100%;background:var(--dac);color:var(--onb);border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;margin-top:10px;cursor:pointer}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--dln)}
.drow:first-child{border-top:0}
.dbar{height:8px;background:var(--dln);border-radius:9px;overflow:hidden;margin-top:8px}
.dbar i{display:block;height:100%;background:var(--dac);border-radius:9px}
.dup{color:var(--dac)}.ddn{color:var(--drd)}
.dx{border:0;background:none;color:var(--drd);cursor:pointer;font-size:16px;padding:0 0 0 10px}
.dseg{display:flex;gap:6px}
.dseg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--dln);background:var(--dbg);color:var(--dtx);font:inherit;font-weight:600;cursor:pointer}
.dseg .don{background:var(--dac);color:var(--onb);border-color:var(--dac)}
.dnote{color:var(--dmu);font-size:12px;margin:10px 4px 0}
#dnav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--dcard) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--dln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#dnav button{flex:1;border:0;background:none;color:var(--dmu);font:inherit;font-size:10.5px;font-weight:600;padding:6px 0;cursor:pointer}
#dnav button span{display:flex;justify-content:center;margin-bottom:2px}
#dnav .don{color:var(--blue)}
.dg .dc:last-child:nth-child(odd){grid-column:1/-1}

#prev{order:1}#next{order:2}
.arrow{background:none;width:36px;height:36px;font-size:30px;font-weight:300;color:var(--blue);padding:0 0 4px}
#sub,.hint{text-align:left;padding:0 4px}
#sub{font-size:15px;margin:2px 0 4px}
.hint{margin-bottom:14px}
.card{padding:12px 10px}
.cal{gap:2px}
.dow{font-size:12px;font-weight:600;letter-spacing:.2px}
.c{background:transparent;min-height:66px;border-radius:14px}
.c.s{background:color-mix(in srgb,var(--tc) 16%,transparent)}
.d{font-size:17px;font-weight:500}
.c.today .d{font-weight:600}

.tcs b{font-weight:600}

dialog h2{font-size:22px;font-weight:700;letter-spacing:.2px}
dialog h3{text-transform:uppercase;font-size:12px;letter-spacing:.3px;font-weight:500}
dialog input,dialog select,dialog textarea{border-radius:12px;background:var(--ebg)}
.chip{background:var(--ebg);border-width:0;font-weight:500}
.chip.on{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn{background:var(--ebg);color:var(--blue);border-radius:14px;padding:14px;font-size:17px;font-weight:500}
.btn.p{background:var(--blue);color:#fff;font-weight:600}
.pr.b,.pr.t{border-top:.5px solid var(--sep)}

.dhero b{font-size:42px;letter-spacing:-.03em;margin:4px 0 10px}
.dc{border-radius:20px}
.dc b{font-weight:600}

.dbtn{background:var(--dac);color:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:600}
.dseg{background:var(--ebg);border-radius:10px;padding:2px;gap:0}
.dseg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:500}

.dbar{height:6px;background:var(--ebg)}
.dup{color:var(--dac)}
.drow{border-top:.5px solid var(--dln)}
.dx{color:var(--drd)}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes sl{from{opacity:0;transform:translateX(26px)}}
@keyframes sr{from{opacity:0;transform:translateX(-26px)}}

.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) backwards}

:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--sheet:cubic-bezier(.32,.72,0,1)}

.sr{animation:sr .5s var(--ease) backwards}

button:active{transform:scale(.95);transition-duration:.1s}
.c{transition:transform .4s var(--spring),background-color .3s ease}
.c:active{transform:scale(.93);transition-duration:.1s}
dialog[open]{animation:sheetIn .55s var(--sheet)}
dialog[open]::backdrop{animation:fade .4s ease;-webkit-backdrop-filter:none;backdrop-filter:none}
dialog.closing[open]{animation:sheetOut .27s cubic-bezier(.4,0,1,1) forwards!important}
dialog.closing[open]::backdrop{animation:fadeOut .27s ease forwards!important}
#dnav .pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:30px;background:var(--ebg);transition:transform .55s var(--sheet),width .55s var(--sheet);pointer-events:none;will-change:transform}
#dnav .pill.nt{transition:none}
#dnav button{position:relative;z-index:1}

.enter>*{animation:rise .32s var(--ease) backwards}
.enter>*:nth-child(n+2){animation-delay:22ms}
.enter>*:nth-child(n+3){animation-delay:44ms}
.enter>*:nth-child(n+4){animation-delay:60ms}
.enter>*:nth-child(n+5){animation-delay:60ms}

@keyframes sr{from{opacity:0;transform:translate3d(-16px,0,0)}}

dialog.closing[open]::backdrop{animation:fadeOut .19s ease forwards!important}

html{scroll-behavior:auto}
